<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>手順書システム リデザイン — B 案 クリッカブル プロトタイプ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    body { margin: 0; font-family: 'Noto Sans JP', 'Plus Jakarta Sans', sans-serif; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="b-shell.jsx"></script>
  <script type="text/babel" src="b-pc.jsx"></script>
  <script type="text/babel" src="b-mobile.jsx"></script>
  <script type="text/babel" src="b-prototype.jsx"></script>
  <script type="text/babel" src="b-extras.jsx"></script>
  <script type="text/babel" src="b-overview.jsx"></script>
  <script type="text/babel" src="tweaks.jsx"></script>

  <script type="text/babel" data-presets="react">
    const P  = window.bPrototype;
    const X  = window.bExtras;
    const OverviewC = window.BOverview;
    const TweaksC   = window.ManualSystemTweaks;

    const PCW = 1280, PCH = 820;
    const MW  = 390,  MH  = 800;

    const App = () => (
      <React.Fragment>
        <DesignCanvas
          title="手順書システム リデザイン — B 案"
          subtitle="HORIZON-JIT / Manual-Management-System — クリッカブル プロトタイプ"
        >
          <DCSection id="intro" title="方向性" subtitle="モダン SaaS 路線 — 濃ネイビーサイドバー × グリーンアクセント">
            <DCArtboard id="overview" label="概要" width={920} height={580}>
              <OverviewC/>
            </DCArtboard>
          </DCSection>

          <DCSection id="pc-flow" title="PC — 主要動線" subtitle="ホーム → 一覧 → 検索結果 → 詳細 → 編集。各画面のリンクをクリックして遷移できます。">
            <DCArtboard id="pc-home"   label="① ホーム"          width={PCW} height={PCH}><P.BPrototypePC initial="home"/></DCArtboard>
            <DCArtboard id="pc-list"   label="② 手順書一覧"      width={PCW} height={PCH}><P.BPrototypePC initial="list"/></DCArtboard>
            <DCArtboard id="pc-search" label="③ 検索結果（ハイライト付き）" width={PCW} height={PCH}><P.BPrototypePC initial="search"/></DCArtboard>
            <DCArtboard id="pc-detail" label="④ 手順書詳細"      width={PCW} height={PCH}><P.BPrototypePC initial="detail"/></DCArtboard>
            <DCArtboard id="pc-edit"   label="⑤ 編集画面"        width={PCW} height={PCH}><P.BPrototypePC initial="edit"/></DCArtboard>
          </DCSection>

          <DCSection id="categories" title="カテゴリ運用 — 折衷案" subtitle="JSON の category 値は『公式 / 別名で公式に解決 / 未承認』の 3 状態で表示。管理者が承認・統合します。">
            <DCArtboard id="pc-admin-cat" label="管理者: カテゴリ承認キュー" width={PCW} height={PCH}><P.BPrototypePC initial="admin-categories"/></DCArtboard>
          </DCSection>

          <DCSection id="pages" title="追加ページ" subtitle="下書き / 新規作成 空状態 / サインイン">
            <DCArtboard id="pc-drafts"   label="下書き一覧"       width={PCW} height={PCH}><X.DraftsPC/></DCArtboard>
            <DCArtboard id="pc-new"      label="新規作成（空状態 + テンプレート）" width={PCW} height={PCH}><X.NewBlankPC/></DCArtboard>
            <DCArtboard id="pc-signin"   label="サインイン"       width={PCW} height={PCH}><X.SignInPC/></DCArtboard>
          </DCSection>

          <DCSection id="modals" title="モーダル雛形" subtitle="共通シェル（タイトル + 本文 + フッター）。角丸 14px / シャドウ大 / ディム 0.55">
            <DCArtboard id="md-help"    label="ヘルプ"           width={PCW} height={PCH}><X.HelpModalPC/></DCArtboard>
            <DCArtboard id="md-folder"  label="Drive フォルダ選択" width={PCW} height={PCH}><X.DriveFolderPickerPC/></DCArtboard>
            <DCArtboard id="md-json"    label="Drive JSON 読込"   width={PCW} height={PCH}><X.DriveJsonPickerPC/></DCArtboard>
            <DCArtboard id="md-share"   label="共有リンク発行"     width={PCW} height={PCH}><X.ShareLinkModalPC/></DCArtboard>
            <DCArtboard id="md-version" label="版履歴 + 差分"      width={PCW} height={PCH}><X.VersionHistoryModalPC/></DCArtboard>
            <DCArtboard id="md-history" label="閲覧履歴"           width={PCW} height={PCH}><X.ViewHistoryModalPC/></DCArtboard>
            <DCArtboard id="md-flow"    label="フローチャート (Mermaid)" width={PCW} height={PCH}><X.FlowchartModalPC/></DCArtboard>
          </DCSection>

          <DCSection id="step-detail" title="ステップエディタ詳細" subtitle="画像注釈 / 条件分岐 / 関連リンクの編集 UI">
            <DCArtboard id="se-detail" label="ステップ編集（注釈・分岐・リンク）" width={PCW} height={PCH}><X.StepEditorDetailPC/></DCArtboard>
          </DCSection>

          <DCSection id="states" title="状態別レイアウト" subtitle="空 / 検索ゼロ / 読み込み / エラー / 権限なし / オフライン">
            <DCArtboard id="states" label="6 つの状態" width={1100} height={760}><X.StatesBoard/></DCArtboard>
          </DCSection>

          <DCSection id="mb-flow" title="Mobile — 主要動線" subtitle="現場担当者の利用シーンを想定。下部タブとカード型 UI。">
            <DCArtboard id="mb-home"   label="① ホーム"      width={MW} height={MH}><P.BPrototypeMobile initial="home"/></DCArtboard>
            <DCArtboard id="mb-list"   label="② 一覧"        width={MW} height={MH}><P.BPrototypeMobile initial="list"/></DCArtboard>
            <DCArtboard id="mb-search" label="③ 検索結果"    width={MW} height={MH}><P.BPrototypeMobile initial="search"/></DCArtboard>
            <DCArtboard id="mb-detail" label="④ 詳細"        width={MW} height={MH}><P.BPrototypeMobile initial="detail"/></DCArtboard>
            <DCArtboard id="mb-edit"   label="⑤ 編集"        width={MW} height={MH}><P.BPrototypeMobile initial="edit"/></DCArtboard>
          </DCSection>
        </DesignCanvas>
        <TweaksC/>
      </React.Fragment>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
